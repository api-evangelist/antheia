name: Antheia
description: 'Antheia, Inc. is a Menlo Park, California synthetic-biology company that manufactures
  biosynthetic key starting materials (KSMs) and active pharmaceutical ingredients (APIs) for essential
  medicines. Founded on Christina Smolke''s Stanford research, Antheia engineers yeast strains that
  reconstruct long, complex plant biosynthetic pathways and ferment sugar into molecules previously
  obtainable only through agricultural cultivation, compressing production timelines from years to
  weeks. Commercial products include fermentation-derived thebaine, oripavine and scopolamine, with a
  development pipeline of 70+ KSMs and APIs spanning neurology, gastrointestinal and oncology programs.
  NOTE FOR THE CATALOG: Antheia''s "APIs" are Active Pharmaceutical Ingredients, not web APIs — the
  company publishes no developer API, SDK, or machine-readable interface contract.'
